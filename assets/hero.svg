<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1a3c"/>
      <stop offset="50%" stop-color="#2a2158"/>
      <stop offset="100%" stop-color="#3a2a6b"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9ecb">
        <animate attributeName="stop-color" values="#ff9ecb;#b58bff;#7ecbff;#ff9ecb" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#c9a0ff"/>
      <stop offset="100%" stop-color="#7ecbff">
        <animate attributeName="stop-color" values="#7ecbff;#ff9ecb;#b58bff;#7ecbff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9ecb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9ecb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ecbff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7ecbff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a0ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c9a0ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <clipPath id="rounded">
      <rect width="1200" height="360" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="360" fill="url(#bg)"/>

    <circle cx="180" cy="90" r="160" fill="url(#blobPink)" filter="url(#soft)">
      <animate attributeName="cy" values="90;110;90" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="80" r="180" fill="url(#blobBlue)" filter="url(#soft)">
      <animate attributeName="cy" values="80;60;80" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="300" r="220" fill="url(#blobPurple)" filter="url(#soft)">
      <animate attributeName="cx" values="620;660;620" dur="10s" repeatCount="indefinite"/>
    </circle>

    <g fill="#ffffff">
      <g opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.4s" repeatCount="indefinite"/>
        <path d="M120,60 L126,74 L140,80 L126,86 L120,100 L114,86 L100,80 L114,74 Z"/>
      </g>
      <g opacity="0.7">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.1s" repeatCount="indefinite"/>
        <path d="M1080,140 L1084,150 L1094,154 L1084,158 L1080,168 L1076,158 L1066,154 L1076,150 Z"/>
      </g>
      <g opacity="0.8">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
        <path d="M95,220 L99,229 L108,233 L99,237 L95,246 L91,237 L82,233 L91,229 Z"/>
      </g>
      <g opacity="0.6">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.6s" repeatCount="indefinite"/>
        <path d="M1120,250 L1123,257 L1130,260 L1123,263 L1120,270 L1117,263 L1110,260 L1117,257 Z"/>
      </g>
      <circle cx="240" cy="260" r="3" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="960" cy="230" r="2.5" opacity="0.8">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="330" cy="50" r="2" opacity="0.6">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3.3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1200" height="360" rx="28" ry="28" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  </g>

  <text x="600" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800"
        text-anchor="middle" fill="url(#titleGrad)" letter-spacing="1">
    Amina Ali ✨
  </text>

  <text x="600" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500"
        text-anchor="middle" fill="#e6def7" letter-spacing="0.5">
    Software Engineer &#8226; Full-Stack Developer &#8226; Product Builder
  </text>

  <g transform="translate(600,240)">
    <circle cx="-70" cy="0" r="3" fill="#ff9ecb"/>
    <rect x="-50" y="-1.5" width="60" height="3" rx="1.5" fill="url(#titleGrad)"/>
    <circle cx="20" cy="0" r="4" fill="#c9a0ff"/>
    <rect x="30" y="-1.5" width="60" height="3" rx="1.5" fill="url(#titleGrad)"/>
    <circle cx="95" cy="0" r="3" fill="#7ecbff"/>
  </g>

  <text x="600" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-style="italic"
        text-anchor="middle" fill="#c3b8e6" opacity="0.85">
    building practical software, one thoughtful product at a time
  </text>
</svg>
